# Alembic configuration for the Career Guidance AI backend.
#
# The database URL is NOT stored here — it is resolved at runtime from the
# application settings (PG_DSN / PG_* variables) in alembic/env.py so that
# migrations always target the same database the app uses.
#
# Usage (from resume_pipeline/):
#   ..\myenv\Scripts\alembic current          # show applied revision
#   ..\myenv\Scripts\alembic upgrade head     # apply pending migrations
#   ..\myenv\Scripts\alembic revision -m "..."  # create a new migration

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

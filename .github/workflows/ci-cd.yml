name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend CI (Tests, Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Test Suite
        working-directory: frontend
        run: npm test

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Verify Production Build
        working-directory: frontend
        run: npm run build

  backend-ci:
    name: Backend CI (Tests & Migrations)
    runs-on: ubuntu-latest

    # Disposable PostgreSQL used to verify the Alembic chain (0001 -> head)
    # against the real database engine, including PG enum/DDL behaviour that
    # SQLite-based tests cannot exercise.
    services:
      postgres:
        # pgvector/pgvector:pg16 = stock PostgreSQL 16 + the `vector` extension
        # that the embedding tables require (baseline creates it via
        # CREATE EXTENSION IF NOT EXISTS vector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_guidance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: resume_pipeline/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr libmagic1

      - name: Install Python Dependencies
        working-directory: resume_pipeline
        run: |
          pip install -r requirements.txt

      # Unit/regression suites run against an in-memory SQLite stub configured
      # inside resume_pipeline/db.py (CI_SKIP_DB_VALIDATION=true).
      - name: Run Pytest Test Suite
        working-directory: resume_pipeline
        env:
          PYTHONPATH: .
          CI_SKIP_DB_VALIDATION: "true"
          SECRET_KEY: "test_secret_key_at_least_32_characters_long_for_signing_jwt"
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_api.py

      # Migration verification: apply the full additive chain to a fresh
      # PostgreSQL database. test_api.py stays excluded everywhere — it is a
      # live OpenCode API connectivity smoke test, not a deterministic suite.
      - name: Verify Alembic Migrations (0001 -> head) on PostgreSQL
        working-directory: resume_pipeline
        env:
          PYTHONPATH: .
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DB: career_guidance_ci
          SECRET_KEY: "test_secret_key_at_least_32_characters_long_for_signing_jwt"
        run: |
          python -m alembic upgrade head
          python -m alembic upgrade head  # idempotency check

  docker-build-push:
    name: Docker Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: resume_pipeline/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/career-guidance-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/career-guidance-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ec2-deploy:
    name: Deploy Backend to AWS EC2 (DISABLED — deploy/aws/ removed; see deploy/gcp/BRINGUP.md)
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    # DISABLED WITH REASON (deploy-path cleanup): deploy/aws/ (ec2-user-data.sh,
    # .env.aws.example, apply-ec2-env.ps1) and
    # deploy/docker/docker-compose.prod.yml were deleted. Single sources are now
    # root .env, root docker-compose.yml (backend-only), and
    # resume_pipeline/Dockerfile. There is no automated GCP equivalent — the
    # documented deploy path is the manual GCE bring-up in
    # deploy/gcp/BRINGUP.md (startup script deploy/gcp/user-data.sh). Parked
    # with `if: false` so CI stays green; no new CI infrastructure invented.
    # The SSH script below is kept updated to the new layout for reference only.
    if: false
    steps:
      - name: Deploy via SSH (reference only — job disabled, see deploy/gcp/BRINGUP.md)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.EC2_DEPLOY_DIR }}
            echo "Reclaiming ownership of the deployment directory..."
            sudo chown -R $(whoami):$(whoami) . || true
            git config --global --add safe.directory '*' || true
            echo "Pulling latest changes from Git repository..."
            git fetch --all
            git checkout main
            git pull --ff-only
            
            echo "Stopping existing backend containers..."
            sudo docker compose --env-file .env down || true
            
            echo "Cleaning up all unused containers, networks, images, and build cache..."
            sudo docker system prune -a -f
            sudo docker builder prune -a -f || true
            
            echo "Pulling latest Docker image from Docker Hub..."
            sudo docker compose --env-file .env pull
            
            echo "Recreating and restarting backend containers..."
            sudo docker compose --env-file .env up -d --force-recreate
            
            echo "Cleaning up old/unused images after deployment..."
            sudo docker image prune -af
            
            echo "Waiting for services to spin up (30 seconds)..."
            sleep 30
            
            echo "Verifying running Docker containers:"
            sudo docker compose ps
            
            echo "Checking container health status:"
            sudo docker inspect --format='{{json .State.Health.Status}}' career-guidance-backend
            
            echo "Displaying backend logs tail:"
            sudo docker compose logs --tail 20 backend
            
            echo "Verifying database connection and data status:"
            sudo docker compose exec -T backend python scripts/verify_data.py || echo "Warning: Database verification script was skipped or killed (likely memory limit exceeded on low-RAM instance), but backend container is running."

